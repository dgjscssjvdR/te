name: 自动交易机器人

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 执行策略
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_SECRET_KEY_ID: ${{ secrets.APCA_SECRET_KEY_ID }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python trading_bot.py
